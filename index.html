<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Chill Space - Tạ Văn Khanh</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Quicksand', sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f0f0f;
        }

        /* Màn hình chào bấm để mở khóa âm thanh */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 10, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
            cursor: pointer;
        }

        #welcome-screen h1 {
            color: #fff;
            font-size: 24px;
            margin-bottom: 15px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        #welcome-screen .enter-btn {
            padding: 12px 35px;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 117, 140, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        #welcome-screen .enter-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 117, 140, 0.6);
        }

        /* Video nền động */
        .background-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .background-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.9);
        }

        /* Hiệu ứng hoa anh đào rơi */
        .sakura {
            position: absolute;
            top: -10px;
            background: linear-gradient(135deg, #ffb7c5, #ffc0cb);
            border-radius: 150% 0 150% 0;
            animation: fall linear infinite;
            z-index: 2;
            opacity: 0.8;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) translateX(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(105vh) translateX(100px) rotate(360deg); opacity: 0.2; }
        }

        /* HIỆU ỨNG CHỮ NHẤP NHÁY ĐỔI MÀU */
        @keyframes colorFlashes {
            0% { color: #ff758c; text-shadow: 0 0 12px rgba(255, 117, 140, 0.7); }
            33% { color: #75fbff; text-shadow: 0 0 12px rgba(117, 251, 255, 0.7); }
            66% { color: #fffb75; text-shadow: 0 0 12px rgba(255, 251, 117, 0.7); }
            100% { color: #ff758c; text-shadow: 0 0 12px rgba(255, 117, 140, 0.7); }
        }

        /* Khu vực thông tin cá nhân */
        .content-overlay {
            position: absolute;
            top: 42%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            text-align: center;
            width: 100%;
            padding: 0 20px;
        }

        .name-with-avatar {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            background: rgba(0, 0, 0, 0.45);
            padding: 6px 16px;
            border-radius: 20px;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .small-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid #fff;
        }

        .content-overlay h3 {
            font-size: 17px;
            font-weight: 700;
            animation: colorFlashes 4s infinite;
        }

        .content-overlay p {
            font-size: 14px;
            margin: 6px 0;
            font-weight: 600;
            text-shadow: 0 2px 6px rgba(0,0,0,0.9);
            animation: colorFlashes 4s infinite;
        }

        .fb-link {
            text-decoration: none;
            animation: colorFlashes 4s infinite;
            transition: transform 0.2s;
            display: inline-block;
        }

        .fb-link:hover {
            transform: scale(1.05);
            text-decoration: underline;
        }

        /* KHUNG ĐỒNG HỒ GÓC DƯỚI BÊN PHẢI */
        .custom-clock-box {
            position: absolute;
            bottom: 25px;
            right: 25px;
            z-index: 10;
            background: rgba(45, 25, 22, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 8px 14px;
            border-radius: 6px;
            text-align: right;
            font-size: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            pointer-events: none;
            line-height: 1.4;
        }

        .custom-clock-box .date-line { font-weight: 700; font-size: 13px; }
        .custom-clock-box .time-line { font-weight: 600; font-size: 12px; color: #f3f3f3; }

        /* Bảng điều khiển nhạc */
        .music-player {
            position: absolute;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(22, 22, 22, 0.75);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 12px 18px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            width: 340px;
        }

        .player-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .track-info-left {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
            max-width: 190px;
        }

        .track-art {
            width: 38px;
            height: 38px;
            border-radius: 6px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .track-details {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-name {
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            display: block;
        }

        .track-artist {
            color: #aaa;
            font-size: 11px;
            display: block;
        }

        .player-center-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .player-center-controls button {
            background: none;
            border: none;
            color: #d1d1d1;
            font-size: 13px;
            cursor: pointer;
            transition: color 0.2s, transform 0.1s;
        }

        .player-center-controls button:hover {
            color: #fff;
            transform: scale(1.1);
        }

        .player-center-controls .main-play-btn {
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- Màn hình chào -->
    <div id="welcome-screen" onclick="startExperience()">
        <h1>✨ Chạm để vào không gian Chill ✨</h1>
        <button class="enter-btn">Vào Web</button>
    </div>

    <!-- Video nền động -->
    <div class="background-container">
        <video autoplay muted loop playsinline>
            <source src="background.mp4" type="video/mp4">
        </video>
    </div>

    <!-- Thẻ Audio điều khiển nhạc ẩn -->
    <audio id="audio-player"></audio>

    <!-- Hoa anh đào rơi -->
    <div id="sakura-container"></div>

    <!-- THÔNG TIN CÁ NHÂN -->
    <div class="content-overlay">
        <div class="name-with-avatar">
            <img src="avatar.jpg" alt="Avatar" class="small-avatar">
            <h3>Tạ Văn Khanh</h3>
        </div>
        <p>Donate: 0363012030 (MBB)</p>
        <p>Facebook: <a href="https://www.facebook.com/share/1DAHM1QBn6/?mibextid=wwXIfr" target="_blank" class="fb-link">Tạ Văn Khanh</a></p>
        <p>Gmail: emcogaydau33@gmail.com</p>
    </div>

    <!-- KHUNG ĐỒNG HỒ GÓC DƯỚI BÊN PHẢI -->
    <div class="custom-clock-box">
        <div class="date-line" id="date-string">Thứ Tư - 16/09/2026</div>
        <div class="time-line" id="time-string">GMT+7 - 22:09:06</div>
    </div>

    <!-- KHUNG PHÁT NHẠC -->
    <div class="music-player">
        <div class="player-top">
            <div class="track-info-left">
                <img id="track-art" src="music.jpg" alt="Art" class="track-art">
                <div class="track-details">
                    <span id="track-name" class="track-name">Đang tải nhạc...</span>
                    <span id="track-artist" class="track-artist">Tạ Văn Khanh</span>
                </div>
            </div>
            <div class="player-center-controls">
                <button onclick="prevTrack()" title="Bài trước"><i class="fa-solid fa-backward-step"></i></button>
                <button class="main-play-btn" onclick="togglePlay()"><i id="play-icon" class="fa-solid fa-play"></i></button>
                <button onclick="nextTrack()" title="Bài tiếp"><i class="fa-solid fa-forward-step"></i></button>
            </div>
        </div>
    </div>

    <script>
        let playlist = [];
        let currentIndex = 0;
        const audioPlayer = document.getElementById('audio-player');
        let isPlaying = false;

        // Tự động đọc danh sách nhạc từ file playlist.json ngoài thư mục
        fetch('playlist.json')
            .then(response => response.json())
            .then(data => {
                playlist = data.songs;
                if (playlist.length > 0) {
                    loadTrack(currentIndex);
                }
            })
            .catch(err => {
                console.log("Không tải được file playlist.json:", err);
                document.getElementById('track-name').innerText = "Lỗi tải playlist!";
            });

        function loadTrack(index) {
            if (playlist.length === 0) return;
            const song = playlist[index];
            audioPlayer.src = song.url;
            document.getElementById('track-name').innerText = song.title;
            document.getElementById('track-artist').innerText = song.artist;
            document.getElementById('track-art').src = song.art || 'music.jpg';
            audioPlayer.load();
        }

        function startExperience() {
            const welcomeScreen = document.getElementById('welcome-screen');
            welcomeScreen.style.opacity = '0';
            setTimeout(() => { welcomeScreen.style.display = 'none'; }, 500);

            if (playlist.length > 0) {
                audioPlayer.play().then(() => {
                    isPlaying = true;
                    document.getElementById('play-icon').className = "fa-solid fa-pause";
                }).catch(e => console.log("Autoplay blocked:", e));
            }
        }

        function togglePlay() {
            if (playlist.length === 0) return;
            if (isPlaying) {
                audioPlayer.pause();
                isPlaying = false;
                document.getElementById('play-icon').className = "fa-solid fa-play";
            } else {
                audioPlayer.play();
                isPlaying = true;
                document.getElementById('play-icon').className = "fa-solid fa-pause";
            }
        }

        function nextTrack() {
            if (playlist.length === 0) return;
            currentIndex = (currentIndex + 1) % playlist.length;
            loadTrack(currentIndex);
            if (isPlaying) audioPlayer.play();
        }

        function prevTrack() {
            if (playlist.length === 0) return;
            currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
            loadTrack(currentIndex);
            if (isPlaying) audioPlayer.play();
        }

        // Tự động chuyển bài tiếp theo khi bài hiện tại chạy hết
        audioPlayer.addEventListener('ended', () => {
            nextTrack();
        });

        // Cập nhật đồng hồ thời gian thực
        function updateClock() {
            const now = new Date();
            const days = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
            const dayName = days[now.getDay()];
            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const year = now.getFullYear();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            document.getElementById('date-string').innerText = `${dayName} - ${day}/${month}/${year}`;
            document.getElementById('time-string').innerText = `GMT+7 - ${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Hiệu ứng hoa anh đào rơi
        const sakuraContainer = document.getElementById('sakura-container');
        for (let i = 0; i < 25; i++) {
            const sakura = document.createElement('div');
            sakura.classList.add('sakura');
            sakura.style.left = Math.random() * 100 + 'vw';
            sakura.style.top = -Math.random() * 20 + 'vh';
            const size = Math.random() * 8 + 6 + 'px';
            sakura.style.width = size;
            sakura.style.height = size;
            sakura.style.animationDuration = Math.random() * 5 + 5 + 's';
            sakura.style.animationDelay = Math.random() * 5 + 's';
            sakuraContainer.appendChild(sakura);
        }
    </script>
</body>
</html>
