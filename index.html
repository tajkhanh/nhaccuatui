<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Chill Space</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Quicksand', sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f0f0f;
        }

        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 10, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
            cursor: pointer;
        }

        #welcome-screen h1 {
            color: #fff;
            font-size: 24px;
            margin-bottom: 15px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        #welcome-screen .enter-btn {
            padding: 12px 35px;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 117, 140, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        #welcome-screen .enter-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 117, 140, 0.6);
        }

        /* Khung chứa video nền động */
        .background-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .background-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.9);
        }

        /* Hiệu ứng hoa anh đào rơi */
        .sakura {
            position: absolute;
            top: -10px;
            background: linear-gradient(135deg, #ffb7c5, #ffc0cb);
            border-radius: 150% 0 150% 0;
            animation: fall linear infinite;
            z-index: 2;
            opacity: 0.8;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) translateX(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) translateX(100px) rotate(360deg);
                opacity: 0.2;
            }
        }

        .content-overlay {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            text-align: center;
            color: #fff;
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
            pointer-events: none;
        }

        .content-overlay h2 {
            font-size: 22px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .content-overlay p {
            font-size: 15px;
            margin: 4px 0;
            color: #f0f0f0;
        }

        .music-player {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(20, 20, 20, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px 20px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 340px;
        }

        .track-info {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-grow: 1;
        }

        .track-art {
            width: 42px;
            height: 42px;
            border-radius: 8px;
            object-fit: cover;
        }

        .track-details .track-title {
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 120px;
        }

        .track-details .track-artist {
            color: #aaa;
            font-size: 11px;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .player-controls button {
            background: none;
            border: none;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            transition: color 0.2s, transform 0.1s;
        }

        .player-controls button:hover {
            color: #ff7eb3;
            transform: scale(1.1);
        }

        .player-controls .play-pause-btn {
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div id="welcome-screen" onclick="startExperience()">
        <h1>✨ Chạm vào màn hình để bắt đầu ✨</h1>
        <button class="enter-btn">Vào Web Chill</button>
    </div>

    <!-- HÌNH NỀN ĐỘNG: Thay chữ background.mp4 thành tên file video của bạn hoặc link video mp4 trực tiếp -->
    <div class="background-container">
        <video autoplay muted loop playsinline>
            <source src="background.mp4" type="video/mp4">
            Trình duyệt của bạn không hỗ trợ video.
        </video>
    </div>

    <div id="sakura-container"></div>

    <div class="content-overlay">
        <h2>Nguyễn Thành Ninh</h2>
        <p>Donate: 886492233 (BIDV)</p>
        <p>Facebook: Nguyễn Thành Ninh (Tatsu)</p>
        <p>Gmail: contact.tatsuya@gmail.com</p>
    </div>

    <div class="music-player">
        <div class="track-info">
            <!-- Ảnh thu nhỏ của bài hát -->
            <img src="https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?q=80&w=100&auto=format&fit=crop" alt="Art" class="track-art">
            <div class="track-details">
                <div class="track-title" id="song-title">Bài Hát Của Tôi</div>
                <div class="track-artist">Tatsu</div>
            </div>
        </div>
        <div class="player-controls">
            <button onclick="prevSong()"><i class="fa-solid fa-backward-step"></i></button>
            <button class="play-pause-btn" onclick="togglePlay()"><i id="play-icon" class="fa-solid fa-play"></i></button>
            <button onclick="nextSong()"><i class="fa-solid fa-forward-step"></i></button>
        </div>
    </div>

    <!-- DANH SÁCH NHẠC CỦA BẠN: Thay các link ở thuộc tính src thành tên file mp3 của bạn (ví dụ: nhac1.mp3) -->
    <audio id="audio-player" loop>
        <source src="nhac1.mp3" type="audio/mp3">
    </audio>

    <script>
        // Thay tên bài hát và tên file nhạc mp3 của bạn vào đây
        const playlist = [
            { title: "Bài Hát 1", artist: "Ninh", src: "nhac1.mp3" },
            { title: "Bài Hát 2", artist: "Ninh", src: "nhac2.mp3" }
        ];
        let currentSongIndex = 0;
        const audio = document.getElementById('audio-player');
        const playIcon = document.getElementById('play-icon');
        const songTitle = document.getElementById('song-title');

        function startExperience() {
            const welcomeScreen = document.getElementById('welcome-screen');
            welcomeScreen.style.opacity = '0';
            setTimeout(() => {
                welcomeScreen.style.display = 'none';
            }, 500);

            audio.play().then(() => {
                playIcon.classList.remove('fa-play');
                playIcon.classList.add('fa-pause');
            }).catch(error => {
                console.log("Autoplay bị chặn:", error);
            });
        }

        function togglePlay() {
            if (audio.paused) {
                audio.play();
                playIcon.classList.remove('fa-play');
                playIcon.classList.add('fa-pause');
            } else {
                audio.pause();
                playIcon.classList.remove('fa-pause');
                playIcon.classList.add('fa-play');
            }
        }

        function nextSong() {
            currentSongIndex = (currentSongIndex + 1) % playlist.length;
            loadSong(currentSongIndex);
            audio.play();
            playIcon.classList.remove('fa-play');
            playIcon.classList.add('fa-pause');
        }

        function prevSong() {
            currentSongIndex = (currentSongIndex - 1 + playlist.length) % playlist.length;
            loadSong(currentSongIndex);
            audio.play();
            playIcon.classList.remove('fa-play');
            playIcon.classList.add('fa-pause');
        }

        function loadSong(index) {
            songTitle.innerText = playlist[index].title;
            audio.src = playlist[index].src;
        }

        // Tạo hiệu ứng hoa anh đào rơi
        const sakuraContainer = document.getElementById('sakura-container');
        const sakuraCount = 25;

        for (let i = 0; i < sakuraCount; i++) {
            const sakura = document.createElement('div');
            sakura.classList.add('sakura');
            sakura.style.left = Math.random() * 100 + 'vw';
            sakura.style.top = -Math.random() * 20 + 'vh';
            
            const size = Math.random() * 8 + 6 + 'px';
            sakura.style.width = size;
            sakura.style.height = size;
            
            sakura.style.animationDuration = Math.random() * 5 + 5 + 's';
            sakura.style.animationDelay = Math.random() * 5 + 's';
            
            sakuraContainer.appendChild(sakura);
        }
    </script>
</body>
</html>
