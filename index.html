<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Chill Space - Tạ Văn Khanh</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Quicksand', sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f0f0f;
        }

        /* Màn hình chào bấm để mở khóa âm thanh */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 10, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
            cursor: pointer;
        }

        #welcome-screen h1 {
            color: #fff;
            font-size: 24px;
            margin-bottom: 15px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        #welcome-screen .enter-btn {
            padding: 12px 35px;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 117, 140, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        #welcome-screen .enter-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 117, 140, 0.6);
        }

        /* Video nền động */
        .background-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .background-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.9);
        }

        /* Hiệu ứng hoa anh đào rơi */
        .sakura {
            position: absolute;
            top: -10px;
            background: linear-gradient(135deg, #ffb7c5, #ffc0cb);
            border-radius: 150% 0 150% 0;
            animation: fall linear infinite;
            z-index: 2;
            opacity: 0.8;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) translateX(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) translateX(100px) rotate(360deg);
                opacity: 0.2;
            }
        }

        /* HIỆU ỨNG CHỮ NHẤP NHÁY ĐỔI MÀU (ĐỒNG BỘ CHO TẤT CẢ) */
        @keyframes colorFlashes {
            0% { color: #ff758c; text-shadow: 0 0 12px rgba(255, 117, 140, 0.7); }
            33% { color: #75fbff; text-shadow: 0 0 12px rgba(117, 251, 255, 0.7); }
            66% { color: #fffb75; text-shadow: 0 0 12px rgba(255, 251, 117, 0.7); }
            100% { color: #ff758c; text-shadow: 0 0 12px rgba(255, 117, 140, 0.7); }
        }

        /* Khu vực thông tin cá nhân */
        .content-overlay {
            position: absolute;
            top: 42%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            text-align: center;
            width: 100%;
            padding: 0 20px;
        }

        .name-with-avatar {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            background: rgba(0, 0, 0, 0.45);
            padding: 6px 16px;
            border-radius: 20px;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .small-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid #fff;
        }

        .content-overlay h3 {
            font-size: 17px;
            font-weight: 700;
            animation: colorFlashes 4s infinite;
        }

        .content-overlay p {
            font-size: 14px;
            margin: 6px 0;
            font-weight: 600;
            text-shadow: 0 2px 6px rgba(0,0,0,0.9);
            animation: colorFlashes 4s infinite;
        }

        /* Link Facebook đồng bộ hiệu ứng màu sắc */
        .fb-link {
            text-decoration: none;
            animation: colorFlashes 4s infinite;
            transition: transform 0.2s;
            display: inline-block;
        }

        .fb-link:hover {
            transform: scale(1.05);
            text-decoration: underline;
        }

        /* Đồng hồ hiển thị góc dưới bên phải y hệt Windows */
        .windows-clock {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 10;
            background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 8px 14px;
            border-radius: 8px;
            text-align: right;
            font-size: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            pointer-events: none;
            line-height: 1.4;
        }

        .windows-clock .time-line {
            font-weight: 600;
            font-size: 13px;
        }

        /* Bảng điều khiển nhạc Glassmorphism */
        .music-player {
            position: absolute;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(22, 22, 22, 0.75);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 14px 20px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            width: 380px;
        }

        .player-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .track-info-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .track-art {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            object-fit: cover;
        }

        .track-name {
            color: #fff;
            font-size: 13px;
            font-weight: 600;
        }

        .player-center-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        .player-center-controls button {
            background: none;
            border: none;
            color: #d1d1d1;
            font-size: 13px;
            cursor: pointer;
            transition: color 0.2s, transform 0.1s;
        }

        .player-center-controls button:hover {
            color: #fff;
            transform: scale(1.1);
        }

        .player-center-controls .main-play-btn {
            width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 12px;
        }

        /* Thanh tua nhạc & thời gian */
        .progress-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 8px;
        }

        .time-text {
            color: #aaa;
            font-size: 11px;
            min-width: 32px;
            text-align: center;
        }

        .progress-bar {
            flex-grow: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
            -webkit-appearance: none;
        }

        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Màn hình chào -->
    <div id="welcome-screen" onclick="startExperience()">
        <h1>✨ Chạm để vào không gian Chill ✨</h1>
        <button class="enter-btn">Vào Web</button>
    </div>

    <!-- Video nền động -->
    <div class="background-container">
        <video autoplay muted loop playsinline>
            <source src="background.mp4" type="video/mp4">
        </video>
    </div>

    <!-- Hoa anh đào rơi -->
    <div id="sakura-container"></div>

    <!-- THÔNG TIN CÁ NHÂN -->
    <div class="content-overlay">
        <div class="name-with-avatar">
            <!-- Tự động nhận file avatar.jpg bạn tải lên -->
            <img src="avatar.jpg" alt="Avatar" class="small-avatar">
            <h3>Tạ Văn Khanh</h3>
        </div>
        <p>Donate: 0363012030 (MBB)</p>
        <p>Facebook: <a href="https://www.facebook.com/share/1DAHM1QBn6/?mibextid=wwXIfr" target="_blank" class="fb-link">Tạ Văn Khanh</a></p>
        <p>Gmail: emcogaydau33@gmail.com</p>
    </div>

    <!-- ĐỒNG HỒ GÓC DƯỚI BÊN PHẢI -->
    <div class="windows-clock" id="windows-clock">
        <div id="date-string">Thứ Tư - 16/09/2026</div>
        <div class="time-line" id="time-string">GMT+7 - 21:28:34</div>
    </div>

    <!-- KHUNG PHÁT NHẠC -->
    <div class="music-player">
        <div class="player-top">
            <div class="track-info-left">
                <!-- Tự động nhận file music.jpg bạn tải lên -->
                <img src="music.jpg" alt="Art" class="track-art">
                <span class="track-name">Music</span>
            </div>
            <div class="player-center-controls">
                <button onclick="prevSong()"><i class="fa-solid fa-backward-step"></i></button>
                <button onclick="toggleLoop()"><i class="fa-solid fa-rotate-right" id="loop-icon"></i></button>
                <button class="main-play-btn" onclick="togglePlay()"><i id="play-icon" class="fa-solid fa-play"></i></button>
                <button onclick="nextSong()"><i class="fa-solid fa-forward-step"></i></button>
            </div>
        </div>
        <div class="progress-container">
            <span class="time-text" id="current-time">0:00</span>
            <input type="range" class="progress-bar" id="progress-bar" value="0" min="0" max="100" onchange="seekAudio()">
            <span class="time-text" id="duration-time">0:00</span>
        </div>
    </div>

    <!-- Thẻ phát nhạc -->
    <audio id="audio-player">
        <source src="nhac.mp3" type="audio/mp3">
    </audio>

    <script>
        const audio = document.getElementById('audio-player');
        const playIcon = document.getElementById('play-icon');
        const progressBar = document.getElementById('progress-bar');
        const currentTimeText = document.getElementById('current-time');
        const durationText = document.getElementById('duration-time');

        const playlist = ["nhac.mp3"];
        let currentSongIndex = 0;

        function startExperience() {
            const welcomeScreen = document.getElementById('welcome-screen');
            welcomeScreen.style.opacity = '0';
            setTimeout(() => {
                welcomeScreen.style.display = 'none';
            }, 500);

            audio.play().then(() => {
                playIcon.classList.remove('fa-play');
                playIcon.classList.add('fa-pause');
            }).catch(error => {
                console.log("Autoplay bị chặn:", error);
            });
        }

        function togglePlay() {
            if (audio.paused) {
                audio.play();
                playIcon.classList.remove('fa-play');
                playIcon.classList.add('fa-pause');
            } else {
                audio.pause();
                playIcon.classList.remove('fa-pause');
                playIcon.classList.add('fa-play');
            }
        }

        function nextSong() {
            currentSongIndex = (currentSongIndex + 1) % playlist.length;
            audio.src = playlist[currentSongIndex];
            audio.play();
            playIcon.classList.remove('fa-play');
            playIcon.classList.add('fa-pause');
        }

        function prevSong() {
            currentSongIndex = (currentSongIndex - 1 + playlist.length) % playlist.length;
            audio.src = playlist[currentSongIndex];
            audio.play();
            playIcon.classList.remove('fa-play');
            playIcon.classList.add('fa-pause');
        }

        function toggleLoop() {
            audio.loop = !audio.loop;
            event.currentTarget.style.color = audio.loop ? '#ff7eb3' : '#d1d1d1';
        }

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const progressPercent = (audio.currentTime / audio.duration) * 100;
                progressBar.value = progressPercent;
                currentTimeText.innerText = formatTime(audio.currentTime);
                durationText.innerText = formatTime(audio.duration);
            }
        });

        function seekAudio() {
            const seekTime = (progressBar.value / 100) * audio.duration;
            audio.currentTime = seekTime;
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        // Cập nhật đồng hồ thời gian thực giống Windows
        function updateClock() {
            const now = new Date();
            const days = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
            const dayName = days[now.getDay()];
            
            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const year = now.getFullYear();
            
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            document.getElementById('date-string').innerText = `${dayName} - ${day}/${month}/${year}`;
            document.getElementById('time-string').innerText = `GMT+7 - ${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Hiệu ứng hoa anh đào rơi
        const sakuraContainer = document.getElementById('sakura-container');
        for (let i = 0; i < 25; i++) {
            const sakura = document.createElement('div');
            sakura.classList.add('sakura');
            sakura.style.left = Math.random() * 100 + 'vw';
            sakura.style.top = -Math.random() * 20 + 'vh';
            const size = Math.random() * 8 + 6 + 'px';
            sakura.style.width = size;
            sakura.style.height = size;
            sakura.style.animationDuration = Math.random() * 5 + 5 + 's';
            sakura.style.animationDelay = Math.random() * 5 + 's';
            sakuraContainer.appendChild(sakura);
        }
    </script>
</body>
</html>
